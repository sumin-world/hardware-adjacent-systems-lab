[project]
name = "channel-analysis-lab"
version = "1.0.0"
description = "Statistical worst-case analysis for high-speed serial channel characterization"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-rf>=0.30",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
